<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256,256)">
    <!-- 外圆环 -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#ffffff" stroke-width="60"/>
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="60" fill="#000000"/>
    <!-- 分割线 - 只有上、下、右三个缺口，左侧保持完整 -->
    <rect x="-15" y="-180" width="30" height="120" fill="#000000"/>
    <rect x="-15" y="60" width="30" height="120" fill="#000000"/>
    <rect x="60" y="-15" width="120" height="30" fill="#000000"/>
    <!-- 注意：删除了左侧的缺口 -->
  </g>
</svg>
